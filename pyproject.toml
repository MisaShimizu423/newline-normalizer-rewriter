[project]
name = "newline-normalizer-rewriter"
version = "0.1.0"
description = "Rewrites line endings (CRLF, CR, or LF) to a single format across files with no third-party dependencies."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
